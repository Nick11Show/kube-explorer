# Release pipeline: dual build line × dual architecture
#
# Build lines (each is a separate branch with its own dependency stack):
#   Line A  k8s-1.31-1.33  -> RKE2/K3s v1.31–v1.33  (Go 1.24.x, client-go v0.33.4, steve v0.6.40)
#   Line B  k8s-1.34-1.36  -> RKE2/K3s v1.34–v1.36  (Go 1.26.x, client-go v0.36.4, steve v0.9.23)
#
# Trigger a release by pushing a per-line tag:
#   Line A -> v0.6.0-1.31
#   Line B -> v0.6.1-1.34
#
# The correct Go toolchain is selected automatically from each branch's go.mod
# via `go-version-file`, so a single workflow serves both build lines.
#
# NOTE: this workflow does NOT publish container images. GitHub-hosted runners
# cannot reach the private Harbor registry, and the project deliberately keeps
# image publishing local-only. Images are built from these release binaries and
# pushed to the private registry on the operator's machine; see docs/USAGE.md.
name: Release (dual build line × dual arch)

on:
  push:
    branches:
      - k8s-1.31-1.33 # Line A
      - k8s-1.34-1.36 # Line B
    tags:
      - "v*.*.*-1.31" # Line A
      - "v*.*.*-1.34" # Line B
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.6.0-1.31"
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: Build linux/${{ matrix.arch }} (embed UI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go (auto from go.mod — picks Line A 1.24 / Line B 1.26)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download embedded UI assets (gitignored; required for -tags embed)
        run: bash scripts/download
      - name: Build static binary with embedded UI
        env:
          CGO_ENABLED: "0"
          # Cross-compile for the matrix target. Without GOARCH the runner
          # (linux/amd64) would emit an x86-64 binary for BOTH artifacts.
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${{ github.ref_name }}"
          COMMIT="$(git rev-parse --short HEAD)"
          go build -tags embed \
            -ldflags "-s -w -extldflags -static \
              -X github.com/cnrancher/kube-explorer/internal/version.Version=${VERSION} \
              -X github.com/cnrancher/kube-explorer/internal/version.GitCommit=${COMMIT} \
              -X github.com/cnrancher/kube-explorer/internal/config.APIUIVersion=1.1.11" \
            -o "dist/kube-explorer-linux-${{ matrix.arch }}" .
      - name: Verify target architecture
        run: |
          BIN="dist/kube-explorer-linux-${{ matrix.arch }}"
          file "$BIN"
          case "${{ matrix.arch }}" in
            amd64) file "$BIN" | grep -q "x86-64" ;;
            arm64) file "$BIN" | grep -q "ARM aarch64" ;;
          esac
          # A cross-compiled arm64 binary cannot execute on the amd64 runner.
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            "$BIN" --help >/dev/null
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kube-explorer-linux-${{ matrix.arch }}
          path: dist/kube-explorer-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Explicit pattern so only the two binary artifacts are downloaded.
      # An unfiltered download-artifact can also pick up internal cache
      # artifacts (e.g. buildx `*.dockerbuild`) whose download may fail after
      # retries and abort the whole release job.
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kube-explorer-linux-*
          merge-multiple: true
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kube-explorer-linux-*
          draft: true
          name: kube-explorer ${{ github.ref_name }}
          body: |
            ## kube-explorer ${{ github.ref_name }}

            Static, UI-embedded binaries for **linux/amd64** and **linux/arm64**.

            - Pick the release line that matches your Kubernetes version (see the
              [Support Matrix](https://github.com/${{ github.repository }}/blob/HEAD/README.md#版本与支持矩阵)).
            - Container images are published to the project's **private registry**
              (not to any public registry); see [Usage Guide](https://github.com/${{ github.repository }}/blob/HEAD/docs/USAGE.md).
            - Usage: `./kube-explorer --http-listen-port=8989 --https-listen-port=0`
              (add `--kubeconfig=...` or let it auto-detect in-cluster configs).

            Full change list is appended below by GitHub's auto-generated notes.
          generate_release_notes: true
