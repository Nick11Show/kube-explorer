# Release pipeline: dual build line × dual architecture
#
# Build lines (each is a separate branch with its own dependency stack):
#   Line A  k8s-1.31-1.33  -> RKE2/K3s v1.31–v1.33  (Go 1.24.x, client-go v0.33.4, steve v0.6.40)
#   Line B  k8s-1.34-1.36  -> RKE2/K3s v1.34–v1.36  (Go 1.26.x, client-go v0.36.4, steve v0.9.23)
#
# Trigger a release by pushing a per-line tag:
#   Line A -> v0.6.0-1.31
#   Line B -> v0.6.1-1.34
#
# The correct Go toolchain is selected automatically from each branch's go.mod
# via `go-version-file`, so a single workflow serves both build lines.
name: Release (dual build line × dual arch)

on:
  push:
    branches:
      - k8s-1.31-1.33 # Line A
      - k8s-1.34-1.36 # Line B
    tags:
      - "v*.*.*-1.31" # Line A
      - "v*.*.*-1.34" # Line B
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.6.0-1.31"
        required: true

permissions:
  contents: write
  packages: write

env:
  # Push to GitHub Container Registry (ghcr.io) under the repo owner.
  # The previously-used `cnrancher/kube-explorer` Docker Hub repo is not writable,
  # and the local Harbor (100.116.110.97:8443) is not reachable from GitHub-hosted
  # runners, so ghcr.io is the registry that works out-of-the-box here.
  IMAGE: ghcr.io/${{ github.repository_owner }}/kube-explorer

jobs:
  binaries:
    name: Build linux/${{ matrix.arch }} (embed UI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go (auto from go.mod — picks Line A 1.24 / Line B 1.26)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download embedded UI assets (gitignored; required for -tags embed)
        run: bash scripts/download
      - name: Build static binary with embedded UI
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ github.ref_name }}"
          COMMIT="$(git rev-parse --short HEAD)"
          go build -tags embed \
            -ldflags "-s -w -extldflags -static \
              -X github.com/cnrancher/kube-explorer/internal/version.Version=${VERSION} \
              -X github.com/cnrancher/kube-explorer/internal/version.GitCommit=${COMMIT} \
              -X github.com/cnrancher/kube-explorer/internal/config.APIUIVersion=1.1.11" \
            -o "dist/kube-explorer-linux-${{ matrix.arch }}" .
      - name: Smoke test
        run: ./dist/kube-explorer-linux-${{ matrix.arch }} --help >/dev/null
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kube-explorer-linux-${{ matrix.arch }}
          path: dist/kube-explorer-linux-${{ matrix.arch }}
          if-no-files-found: error

  image:
    name: Build & push multi-arch image
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage binaries for image build
        run: |
          mkdir -p package
          cp artifacts/kube-explorer-linux-amd64 package/
          cp artifacts/kube-explorer-linux-arm64 package/
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: package
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Draft GitHub release
    needs: [binaries, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kube-explorer-linux-*
          draft: true
          generate_release_notes: true
